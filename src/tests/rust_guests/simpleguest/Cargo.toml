[package]
name = "simpleguest"
version = "0.10.0"
edition = "2021"

[dependencies]
hyperlight-guest = { path = "../../../hyperlight_guest" }
hyperlight-guest-bin = { path = "../../../hyperlight_guest_bin", default-features = false, features = ["macros"] }
hyperlight-common = { path = "../../../hyperlight_common", default-features = false }
hyperlight-guest-tracing = { path = "../../../hyperlight_guest_tracing" }
log = {version = "0.4", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["log", "attributes"] }

[features]
default = []
trace_guest = ["hyperlight-guest-bin/trace_guest", "hyperlight-guest/trace_guest", "hyperlight-guest-tracing/trace"]
mem_profile = ["hyperlight-common/mem_profile", "hyperlight-guest-bin/mem_profile"]
# Run this guest's user code in ring 3 (x86_64). Used to build the ring 3
# variant of simpleguest for the userspace benchmarks and integration tests.
userspace = ["hyperlight-guest-bin/userspace", "hyperlight-guest/userspace", "hyperlight-common/userspace"]

